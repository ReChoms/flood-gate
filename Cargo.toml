[package]
name = "floodgate"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
http = "1.5.0"
prost = "0.13.5"
prost-reflect = { version = "0.14.7", features = ["serde"] }
protox = "0.7.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = "0.12.3"

[build-dependencies]
protox = "0.7.2"
tonic-build = { version = "0.12.3", default-features = false, features = ["prost"] }
